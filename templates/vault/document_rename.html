{% extends 'base.html' %}
{% block title %}Edit {{ doc.name }}{% endblock %}

{% block content %}
<div class="page-content">
  <div class="upload-header">
    <a href="{% url 'document_viewer' doc.pk %}" class="back-btn">← Back</a>
    <h1>Edit Document</h1>
    <p>{{ doc.member.display_name }} · {{ doc.get_category_display }}</p>
  </div>

  <form method="post" class="upload-form">
    {% csrf_token %}

    <div class="form-group">
      <label class="form-label">Document Name</label>
      <input type="text" name="name" class="form-input" value="{{ form.name.value }}" required>
      {% if form.name.errors %}<div class="form-error">{{ form.name.errors.0 }}</div>{% endif %}
    </div>

    <div class="form-group">
      <label class="form-label">Category</label>
      <select name="category" class="form-select">
        {% for val, label in form.fields.category.choices %}
        <option value="{{ val }}" {% if form.category.value == val %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Notes</label>
      <textarea name="notes" class="form-input" rows="4">{{ form.notes.value|default:'' }}</textarea>
    </div>

    <button type="submit" class="submit-btn">Save Changes</button>
  </form>
</div>
{% endblock %}
