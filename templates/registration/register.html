<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Wault</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
{% load static %}
<link rel="stylesheet" href="{% static 'css/vault.css' %}">
</head>
<body class="auth-page">

<div class="auth-bg">
  <div class="auth-glow auth-glow-1"></div>
  <div class="auth-glow auth-glow-2"></div>
</div>

<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-icon">🔐</div>
    <div class="auth-logo-text">Wault</div>
    <div class="auth-logo-sub">Create your Family Vault</div>
  </div>

  {% if form.errors %}
  <div class="auth-error">
    <span>✕</span>
    {% for field in form %}{% for error in field.errors %}{{ error }}{% endfor %}{% endfor %}
    {% for error in form.non_field_errors %}{{ error }}{% endfor %}
  </div>
  {% endif %}

  <form method="post" class="auth-form">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-input" placeholder="Choose a username" autofocus required
        value="{{ form.username.value|default:'' }}">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" name="password1" class="form-input" placeholder="Choose a strong password" required>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input type="password" name="password2" class="form-input" placeholder="Repeat your password" required>
    </div>
    <button type="submit" class="submit-btn" style="margin-top:8px;">Create Vault</button>
  </form>

  <p class="auth-hint" style="margin-top:16px;">
    Already have an account? <a href="{% url 'login' %}" style="color:var(--accent);">Sign in</a>
  </p>
</div>

</body>
</html>
